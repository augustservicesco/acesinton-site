<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks &mdash; Sinton Ace Hardware</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='8' fill='%23E41837'/><text x='50' y='74' font-size='66' font-family='Helvetica,Arial,sans-serif' font-style='italic' font-weight='bold' fill='white' text-anchor='middle'>A</text></svg>">
<style>
  @font-face{font-family:'Archivo';font-style:italic;font-weight:400 900;font-display:swap;src:url('archivo-var-italic.woff2') format('woff2')}
  @font-face{font-family:'Public Sans';font-style:normal;font-weight:400;font-display:swap;src:url('publicsans-400.woff2') format('woff2')}
  @font-face{font-family:'Public Sans';font-style:normal;font-weight:600;font-display:swap;src:url('publicsans-600.woff2') format('woff2')}
  :root{--ace-red:#E41837;--ace-red-700:#C3112D;--ace-black:#0A0B0E;--n-600:#57534D;--n-200:#E1DED9}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ace-black);font:400 17px/1.55 'Public Sans','Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
  .bar{background:var(--ace-black);height:8px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
  .box{max-width:520px;text-align:center}
  img{width:280px;max-width:70vw;margin:0 0 30px}
  h1{font:900 italic 38px/1.05 'Archivo','Helvetica Neue',Arial,sans-serif;letter-spacing:-.02em;margin:0 0 14px}
  p{margin:0 0 10px;color:var(--n-600)}
  a.back{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 26px;margin:26px 0 0;background:var(--ace-red);color:#fff;text-decoration:none;border-radius:4px;font:800 16px 'Archivo','Helvetica Neue',Arial,sans-serif}
  a.back:hover{background:var(--ace-red-700)}
  footer{border-top:1px solid var(--n-200);padding:20px 24px 34px;text-align:center;font-size:14px;color:var(--n-600)}
  footer a{color:var(--n-600)}
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <div class="box">
    <img src="logo.png" alt="Sinton Ace Hardware">
    <h1>Thanks &mdash; We Got It</h1>
    <p>Your account request is in. Someone from the store will follow up with an application, usually within a business day.</p>
    <p>Need something sooner? Call us at <a href="tel:+13613644636">(361) 364-4636</a>.</p>
    <a class="back" href="/">Back to the Store</a>
  </div>
</main>
<footer>
  Sinton Ace Hardware &middot; 105 W Sinton St, Sinton, TX 78387 &middot; <a href="tel:+13613644636">(361) 364-4636</a>
</footer>
</body>
</html>
